project_id = "promenadis"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = ["./schemas/*.sql"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 900

[auth.email.template.magic_link]
subject = "Din inloggningskod för Promenadis / Your Promenadis sign-in code"
content_path = "./supabase/templates/magic-link.html"

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.api-v1]
enabled = true
verify_jwt = false
entrypoint = "./functions/api-v1/index.ts"

[analytics]
enabled = false
